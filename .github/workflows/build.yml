name: Build

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Das Repo enthält kein gradlew-Script, nur das Wrapper-Jar
      - name: Build & Test
        run: java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain build --console=plain

      - name: Upload Plugin-Jar
        uses: actions/upload-artifact@v4
        with:
          name: TheHungerGames
          path: hungergames-plugin/build/libs/*.jar

      - name: Upload Testreports bei Fehlschlag
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: hungergames-plugin/build/reports/tests/

      # Auf main: fertige Jar als rollendes "latest"-Release veröffentlichen,
      # damit sie ohne Login direkt heruntergeladen werden kann.
      - name: Rolling Latest-Release veröffentlichen
        if: github.ref == 'refs/heads/main' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls hungergames-plugin/build/libs/*.jar | head -1)
          cp "$JAR" TheHungerGames-latest.jar
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest TheHungerGames-latest.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest build (main)" \
            --notes "Automatisch gebaut aus \`main\` (${GITHUB_SHA:0:7}). Immer der aktuelle Stand." \
            --prerelease
